name: release-plz

on:
  push:
    branches: [master]

permissions: {}

jobs:
  # Opens or updates the release PR as the macalinao-release-bot GitHub App:
  # PRs made with GITHUB_TOKEN don't trigger CI, so the required `ci` check
  # would never report.
  release-plz-pr:
    if: github.repository_owner == 'macalinao' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Publishes unpublished versions to crates.io with a short-lived token from
  # trusted publishing (no CARGO_REGISTRY_TOKEN secret), tags them and creates
  # GitHub releases.
  release-plz-release:
    if: github.repository_owner == 'macalinao' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.releases_created == 'true' && fromJSON(steps.release.outputs.releases)[0].tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The release job keeps GITHUB_TOKEN; tags and releases it creates don't
  # trigger other workflows, so build the binaries from here.
  binaries:
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
