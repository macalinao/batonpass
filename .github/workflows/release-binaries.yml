name: release binaries

# Builds baton for each target and attaches the archives to the GitHub
# release for `tag`. Runs from release-plz.yml after a release, by hand for a
# tag, and on PRs that change this file (build only).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        type: string
        required: true
  pull_request:
    paths: [.github/workflows/release-binaries.yml]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Static musl binaries, cross-linked with zig.
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=baton-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/baton LICENSE README.md "$name"/
          tar -czf "$name.tar.gz" -C "$name" baton LICENSE README.md
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: baton-${{ matrix.target }}
          path: baton-${{ matrix.target }}.tar.gz*

  upload:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release upload "$TAG" baton-*.tar.gz* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
